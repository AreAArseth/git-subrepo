name: Test

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  history-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        legacy: ["5e0f401f877cb54c4462766eec88e3c5f23d39a6", "91edb7044289294b9e47f646217461c47639c346"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.legacy }}
          path: legacy
          persist-credentials: false
      - name: Exercise the pinned old client against migrated repositories
        working-directory: current
        run: make test-history-compat legacy_root="$GITHUB_WORKSPACE/legacy"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure we're on a proper branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # For PRs, create a local branch from the HEAD
            git checkout -b "pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.ref }}"
          elif git symbolic-ref -q HEAD >/dev/null; then
            # Already on a branch, nothing to do
            echo "Already on branch $(git branch --show-current)"
          else
            # Detached HEAD, create a branch
            git checkout -b "workflow-$(date +%s)"
          fi
      - if: startsWith(matrix.os, 'macos')
        run: brew install bash
      - run: git config --global user.email "you@example.com";
          git config --global user.name "Your Name";
          git config --global init.defaultBranch "master";
          git config --global --add safe.directory "$PWD";
          git config --global --add safe.directory "$PWD.git";
      - if: startsWith(matrix.os, 'macos')
        run: make test
      - if: startsWith(matrix.os, 'ubuntu')
        run: make CI_TEST
